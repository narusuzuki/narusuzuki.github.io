<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#377566">
<title>DewHand · HOT3D alternative preview</title>
<link rel="icon" href="../../assets/favicon.png">
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#243a31;background:#fff;font-synthesis:none}*{box-sizing:border-box}body{margin:0}main{max-width:1200px;margin:auto;padding:28px 20px 48px}header{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 24px;gap:20px}h1{font-size:30px;letter-spacing:-1px;margin:0;font-weight:750;color:#377566}header p{margin:6px 0 0;color:#718078;font-size:14px}a{color:#547066;font-size:14px;text-decoration:none}a:hover{text-decoration:underline}.viewer{overflow:hidden;border-radius:12px;background:#fff;width:100%;aspect-ratio:1840/1000}.viewer video{display:block;width:100%;height:100%;object-fit:contain}.samples{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:420px;margin:22px auto 0}.samples button{min-width:0;padding:5px 5px 9px;border:2px solid transparent;border-radius:10px;background:#f5f7f6;color:#52655e;font:inherit;font-size:13px;font-weight:600;cursor:pointer}.samples button[aria-pressed=true]{border-color:#377566;background:#edf6f1;color:#377566}.samples img{display:block;width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;border-radius:5px;margin-bottom:6px}.samples button:hover{background:#edf6f1}button:focus-visible,a:focus-visible{outline:3px solid #377566;outline-offset:4px}@media(max-width:600px){main{padding:22px 12px 32px}header{margin:0 8px 20px}h1{font-size:26px}.samples{max-width:360px;gap:8px}}
.viewer.focus{aspect-ratio:920/1000}.viewer.focus video{width:200%;max-width:none;object-fit:fill;transform:translateX(-50%)}.view-options{display:flex;justify-content:flex-end;margin:8px 3px 0}.view-options button{border:0;background:none;color:#377566;font:inherit;font-size:13px;font-weight:600;padding:6px 4px;cursor:pointer}.view-options button:hover{text-decoration:underline}
</style>
</head>
<body>
<main>
<header><div><h1>DewHand</h1><p>HOT3D alternative · preview</p></div><a href="../../#teaser">Project page ↗</a></header>
<div class="viewer"><video id="preview-video" width="1840" height="1000" muted loop playsinline preload="metadata" aria-label="DewHand HOT3D black container candidate"></video></div>
<div class="view-options"><button id="view-toggle" type="button" aria-controls="preview-video"></button></div>
<nav class="samples" aria-label="Compare HOT3D examples"></nav>
</main>
<script>
const clips = [
  {label:'Black container candidate',src:'./assets/black-holder.mp4?v=171aed11',poster:'./assets/black-holder.jpg?v=171aed11',thumb:'./assets/black-holder-thumb.jpg?v=171aed11'},
  {label:'Current Example 2',src:'../../assets/videos/teaser-02.mp4?v=740178fc',poster:'../../assets/videos/teaser-02.jpg?v=740178fc',thumb:'../../assets/videos/teaser-02-thumb.jpg?v=740178fc'}
];
const video=document.querySelector('#preview-video');
const viewer=document.querySelector('.viewer');
const viewToggle=document.querySelector('#view-toggle');
function setFocus(focus){viewer.classList.toggle('focus',focus);viewToggle.textContent=focus?'Show both views':'Focus on 3D view';viewToggle.setAttribute('aria-pressed',String(focus));}
setFocus(matchMedia('(max-width: 600px)').matches);
viewToggle.addEventListener('click',()=>setFocus(!viewer.classList.contains('focus')));
const nav=document.querySelector('.samples');
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
let visible=true;
let resume=!reducedMotion.matches;
video.muted=video.defaultMuted=true;
function playIfVisible(){if(!visible||document.hidden){resume=resume||!video.paused;video.pause();}else if(resume){resume=false;video.play().catch(()=>{});}}
const buttons=clips.map((item,index)=>{
  const button=document.createElement('button');button.type='button';button.setAttribute('aria-controls',video.id);button.setAttribute('aria-label',`Show ${item.label}`);button.setAttribute('aria-pressed',String(index===0));
  const image=document.createElement('img');image.src=item.thumb;image.alt='';image.width=240;image.height=150;button.append(image,item.label);
  button.addEventListener('click',()=>{video.pause();video.poster=item.poster;video.src=item.src;video.setAttribute('aria-label',`DewHand teaser preview, ${item.label}`);buttons.forEach((other,j)=>other.setAttribute('aria-pressed',String(j===index)));resume=true;playIfVisible();});
  nav.append(button);return button;
});
video.poster=clips[0].poster;video.src=clips[0].src;playIfVisible();
if('IntersectionObserver' in window)new IntersectionObserver(entries=>{visible=entries[0].isIntersecting;playIfVisible();},{threshold:.15}).observe(video);
document.addEventListener('visibilitychange',playIfVisible);
reducedMotion.addEventListener('change',()=>{if(reducedMotion.matches){resume=false;video.pause();}});
</script>
</body>
</html>
